  <body>
    <div id="xoay">
      <div class="xoay-icon">📱↻</div>
      <h2>Xoay ngang một chút nhé</h2>
      <p>Để món quà 20/11 hiện trọn vẹn.</p>
    </div>

    <main id="app">
      <section id="intro" class="man hien">
        <div class="hoa hoa-tl"></div>
        <div class="hoa hoa-tr"></div>
        <div class="logo-2011"><b>20/11</b></div>
        <div class="khung">
          <h1 id="loiMo"></h1>
        </div>
        <button id="nutMo" class="nut-hong"></button>
        <div id="tim-bay"></div>
      </section>

      <section id="canh" class="man">
        <div class="may may1"></div>
        <div class="may may2"></div>
        <div class="may may3"></div>
        <div class="may may4"></div>
        <div id="sao"></div>
        <div id="manh-giay"></div>
        <i class="bay bay1"></i><i class="bay bay2"></i><i class="bay bay3"></i>
        <svg class="sach sach-trai" viewBox="0 0 200 150">
          <use href="#sach" />
        </svg>
        <svg class="sach sach-phai" viewBox="0 0 200 150">
          <use href="#sach" />
        </svg>
        <svg
          class="doi"
          viewBox="0 0 1000 300"
          preserveAspectRatio="xMidYMax slice"
        >
          <path d="M0 150 Q250 70 520 140 T1000 120 V300H0Z" fill="#2b5fb4" />
          <g fill="#2f6fa6">
            <ellipse cx="420" cy="150" rx="46" ry="26" />
            <ellipse cx="520" cy="140" rx="40" ry="22" />
            <ellipse cx="610" cy="150" rx="50" ry="26" />
            <ellipse cx="700" cy="140" rx="36" ry="20" />
          </g>
          <path d="M0 205 Q300 130 620 195 T1000 175 V300H0Z" fill="#244f9f" />
          <g>
            <ellipse cx="60" cy="190" rx="110" ry="70" fill="#1f5f86" />
            <ellipse cx="190" cy="215" rx="95" ry="60" fill="#2a7597" />
            <ellipse cx="40" cy="260" rx="120" ry="60" fill="#18506f" />

          </g>
          <path d="M0 262 Q420 222 1000 252 V300H0Z" fill="#163a86" />
        </svg>
        <svg class="thoi thoi1" viewBox="0 0 40 40">
          <use href="#thoTrang" />
        </svg>
        <svg class="thoi thoi2" viewBox="0 0 40 40">
          <use href="#thoTrang" />
        </svg>

        <button id="hoaTulip" class="hoa-tulip" aria-label="Mở thư chúc">
          <svg class="bo" viewBox="0 0 200 300"><use href="#bohoa" /></svg>
          <span class="phongbi"
            ><b class="nap"></b><b class="than"></b><b class="dau"></b
          ></span>
          <span class="goi-y">Chạm vào bó hoa nhé 💗</span>
        </button>

        <div id="thu" class="thu" role="dialog" aria-modal="true">
          <button id="dongThu" class="nut-x" aria-label="Đóng">×</button>
          <div class="thu-noidung">
            <h3 id="thuTieuDe"></h3>
            <div id="thuNoiDung"></div>
            <p id="thuKy" class="ky"></p>
          </div>
        </div>
      </section>

      <button id="nutNhac" class="nut-nhac" aria-label="Bật/tắt nhạc">♪</button>
      <audio id="nhac" loop preload="auto"></audio>
    </main>
